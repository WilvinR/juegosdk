name: Ashlands Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Create Android project structure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-project/app/src/main/java/com/ashlands/game
          mkdir -p android-project/app/src/main/assets

          cp MainActivity.java \
            android-project/app/src/main/java/com/ashlands/game/MainActivity.java

          cp AndroidManifest.xml \
            android-project/app/src/main/AndroidManifest.xml

          cp index.html \
            android-project/app/src/main/assets/index.html

          cp proguard-rules.pro \
            android-project/app/proguard-rules.pro

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'Ashlands'
          include ':app'
          EOF

          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > android-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ashlands.game'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.ashlands.game'
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '0.1.0'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix '.debug'
                      versionNameSuffix '-debug'
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false

                      proguardFiles \
                          getDefaultProguardFile('proguard-android-optimize.txt'), \
                          'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          gradle -p android-project :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        run: |
          test -s android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ashlands-0.1.0-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14